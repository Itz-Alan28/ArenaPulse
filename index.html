<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ArenaPulse | FIFA World Cup 2026 Ops</title>
                <style>
                        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
                                body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
                                        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #1e293b; padding-bottom: 15px; }
                                                .header h1 { color: #38bdf8; font-size: 24px; }
                                                        .header p { color: #94a3b8; font-size: 14px; }
                                                                .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
                                                                        .form-group { margin-bottom: 15px; }
                                                                                label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 5px; }
                                                                                        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
                                                                                                button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
                                                                                                        button:hover { background: #0369a1; }
                                                                                                                .result-box { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; display: none; }
                                                                                                                        .result-box h3 { font-size: 16px; color: #38bdf8; margin-bottom: 10px; }
                                                                                                                                .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 5px; }
                                                                                                                                        .priority-Critical { background: #ef4444; color: white; }
                                                                                                                                                .priority-High { background: #f97316; color: white; }
                                                                                                                                                        .priority-Medium { background: #eab308; color: black; }
                                                                                                                                                                .priority-Low { background: #22c55e; color: white; }
                                                                                                                                                                    </style>
                                                                                                                                                                    </head>
                                                                                                                                                                    <body>

                                                                                                                                                                        <div class="header">
                                                                                                                                                                                <h1>ArenaPulse</h1>
                                                                                                                                                                                        <p>Real-Time AI Incident Triage Hub • FIFA 2026</p>
                                                                                                                                                                                            </div>

                                                                                                                                                                                                <div class="container">
                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                    <label for="location">Stadium Zone / Gate / Seat:</label>
                                                                                                                                                                                                                                <input type="text" id="location" placeholder="e.g., Gate 4 / Section 102">
                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                            <label for="description">Incident Description:</label>
                                                                                                                                                                                                                                                                        <textarea id="description" rows="3" placeholder="Describe the situation..."></textarea>
                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                        <button onclick="submitReport()">Analyze & Dispatch AI</button>

                                                                                                                                                                                                                                                                                                <div id="result" class="result-box">
                                                                                                                                                                                                                                                                                                            <h3>AI Dispatch Analysis</h3>
                                                                                                                                                                                                                                                                                                                        <p><strong>Category:</strong> <span id="cat"></span></p>
                                                                                                                                                                                                                                                                                                                                    <p><strong>Priority:</strong> <span id="prio" class="tag"></span></p>
                                                                                                                                                                                                                                                                                                                                                <p style="margin-top: 8px;"><strong>Summary:</strong> <span id="summary"></span></p>
                                                                                                                                                                                                                                                                                                                                                            <p style="margin-top: 8px;"><strong>Action Required:</strong> <span id="action"></span></p>
                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                    async function submitReport() {
                                                                                                                                                                                                                                                                                                                                                                                                const location = document.getElementById('location').value;
                                                                                                                                                                                                                                                                                                                                                                                                            const description = document.getElementById('description').value;
                                                                                                                                                                                                                                                                                                                                                                                                                        const resultBox = document.getElementById('result');

                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!location || !description) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Please fill in both fields.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            resultBox.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultBox.innerHTML = '<p style="color: #94a3b8;">Processing through Gemini AI...</p>';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const response = await fetch('/api/triage', {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        method: 'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                body: JSON.stringify({ location, description })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const resData = await response.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (resData.status === "success") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const data = resData.data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultBox.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>AI Dispatch Analysis</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Category:</strong> ${data.category}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Priority:</strong> <span class="tag priority-${data.priority}">${data.priority}</span></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p style="margin-top: 8px;"><strong>Summary:</strong> ${data.summary}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p style="margin-top: 8px;"><strong>Action Required:</strong> ${data.recommended_action}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resultBox.innerHTML = `<p style="color: #ef4444;">Error: ${resData.detail || 'Failed to get response'}</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultBox.innerHTML = `<p style="color: #ef4444;">Connection failed. Ensure API server is running.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
